[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "technas"
dynamic = ["version"]
description = "Technas: payments and user accounts behind one client and one secret. The full package; `technas-pay` and `technas-accounts` are the thin ones."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Technas" }]
# The full package depends on the thin ones, never the reverse.
dependencies = [
  "technas-pay @ git+https://github.com/Technas-Organization/technas-pay-python@v0.7.1",
  "technas-accounts @ git+https://github.com/Technas-Organization/technas-accounts-python@v0.1.0",
]
keywords = ["technas", "payments", "mobile money", "accounts", "users", "sign-in"]
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Technas-Organization/technas-python"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/technas/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/technas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
