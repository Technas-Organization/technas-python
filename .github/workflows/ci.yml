name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Public repository: GitHub-hosted machines only. The tests need nothing of ours (fake server).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.9", os: ubuntu-22.04 }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Build
        run: python -m build
